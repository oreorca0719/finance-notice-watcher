# KB국민은행 공고 감시기 설정
# 이 파일만 고치면 재배포 없이 동작이 바뀝니다. 비밀번호는 .env 에 둡니다.

# ─── 감시 대상 기관 ───────────────────────────────────────────────
# 기관을 추가하려면 여기에 항목만 늘리면 됩니다. 코드 수정 불필요.
#   id       : 내부 식별자(중복 판정 키). 한 번 정하면 바꾸지 마십시오.
#   adapter  : core/adapters/ 에 등록된 파서 이름
#   enabled  : false 로 두면 조회하지 않습니다(잠시 끌 때 사용)
sources:
  - id: kb
    name: KB국민은행
    adapter: kb
    base: "https://omoney.kbstar.com"
    enabled: true
    list_pages: 3          # 1페이지=10건. 3이면 30건까지 역추적
    request_delay: 0.8     # 요청 간격(초). 서버 예의상 0.5 이상 유지
    timeout: 30
    warm_path: "/quics?page=oabout"
    params:
      page_code: "C018592"
      board_id: "648"
      comp_id: "b031439"

  - id: woorifg
    name: 우리금융그룹
    adapter: woorifg
    base: "https://www.woorifg.com"
    enabled: true
    list_pages: 2          # 1페이지=10건. 게시 빈도가 낮아 2페이지면 충분
    request_delay: 0.8
    timeout: 30
    warm_path: "/kor/main/index.do"

  - id: nonghyup
    name: 농협
    adapter: nonghyup
    base: "https://www.nonghyup.com"
    enabled: true
    list_pages: 3          # 1페이지=10건. 은행 IT 사업과 시설공사가 섞여 있어 여유 확보
    request_delay: 0.8
    timeout: 30
    warm_path: "/ecenter/bid/bidList.do"
    skip_require: true     # 게시판 자체가 입찰공고 전용. 제목에 '공고'가 없는 건이 많다

  - id: nhit
    name: 농협정보시스템
    adapter: nhit
    base: "https://www.nonghyupit.com"
    enabled: true
    list_pages: 2
    request_delay: 0.8
    timeout: 30
    warm_path: "/nonghyupit/4485/subview.do"
    skip_require: true     # 입찰공고 전용 게시판
    params:
      list_path: "/nonghyupit/4485/subview.do"
      site_key: "nonghyupit"
      menu_key: "675"

  - id: nhfn
    name: NH농협금융지주
    adapter: nhcms
    base: "https://www.nhfngroup.com"
    enabled: true
    list_pages: 2
    request_delay: 0.8
    timeout: 30
    warm_path: "/user/indexSub.do?codyMenuSeq=1102093359&siteId=nhfngroup"
    skip_require: true
    params:
      site_id: "nhfngroup"
      board_id: "5177627"
      menu_seq: "1102093359"

  - id: nhab
    name: 농협경제지주
    adapter: nhcms
    base: "http://www.nhabgroup.com"
    enabled: true
    list_pages: 2
    request_delay: 0.8
    timeout: 30
    warm_path: "/user/indexSub.do?codyMenuSeq=602309274&siteId=nhabgroup"
    skip_require: true
    params:
      site_id: "nhabgroup"
      board_id: "5121866"
      menu_seq: "602309274"

  - id: shinhanfund
    name: 신한자산운용
    adapter: simpleboard
    base: "https://www.shinhanfund.com"
    enabled: true
    list_pages: 1          # 페이징 파라미터가 동작하지 않아 1페이지만 조회
    request_delay: 0.8
    timeout: 30
    warm_path: "/ko/pc/board/notice"
    params:
      variant: "shinhanfund"
      list_path: "/ko/pc/board/notice"
      view_path: "/ko/pc/board/noticeView?no="
      page_param: "page"
      marker: "tb-subj"

  - id: woorisb
    name: 우리금융저축은행
    adapter: simpleboard
    base: "https://www.woorisavingsbank.com"
    enabled: true
    list_pages: 2
    request_delay: 0.8
    timeout: 30
    warm_path: "/intro-notice/list.do?lgrpCd=INTRO-NOTICE"
    params:
      variant: "woorisb"
      attachments: false   # fileSn 만 노출되어 다운로드 경로 확정 불가 → 파일명만 표시
      list_path: "/intro-notice/list.do?lgrpCd=INTRO-NOTICE"
      view_path: "/intro-notice/view.do?blcSn="
      page_param: "page"
      marker: "board__item"

  - id: hana
    name: 하나은행
    adapter: hana
    base: "https://www.kebhana.com"
    enabled: true
    list_pages: 3          # 1페이지=10건. 일반 공지가 섞여 있어 여유 있게 확보
    request_delay: 0.8
    timeout: 30
    warm_path: "/index.jsp"


  # ─── 2026-09 추가 (증권·IT 자회사·지주) ───────────────────────────
  - id: ksfc
    name: 한국증권금융
    adapter: ksfc
    base: "https://www.ksfc.co.kr:4443"
    enabled: true
    list_pages: 2          # 1페이지=10건
    request_delay: 0.8
    timeout: 30
    warm_path: "/customer/notice/list.do"
    params:
      list_path: "/customer/notice/list.do"
      view_path: "/customer/notice/view.do"
      attachments: false   # 목록만 사용

  - id: ksfcpress
    name: 한국증권금융 보도자료
    adapter: ksfc
    base: "https://www.ksfc.co.kr:4443"
    enabled: false         # 보도자료는 공고가 아니라 기본으로 꺼 둔다. 필요하면 true
    list_pages: 1
    request_delay: 0.8
    timeout: 30
    warm_path: "/finance/pr/press/list.do"
    params:
      list_path: "/finance/pr/press/list.do"
      view_path: "/finance/pr/press/view.do"
      attachments: false

  - id: ibksystem
    name: IBK시스템
    adapter: ibksystem
    base: "https://www.ibksystem.co.kr"
    enabled: true
    list_pages: 2          # 1페이지=15건
    request_delay: 0.8
    timeout: 30
    warm_path: "/board?brdId=BRD002"
    params:
      board_id: "BRD002"   # 입찰공고 게시판
      attachments: false

  - id: koscom
    name: 코스콤
    adapter: koscom
    base: "https://www.koscom.co.kr"
    enabled: true
    list_pages: 2          # 1페이지=10건
    request_delay: 0.8
    timeout: 30
    warm_path: "/portal/bbs/B0000002/list.do?menuNo=200264"
    skip_require: true     # 입찰공고 전용 게시판
    params:
      list_path: "/portal/bbs/B0000002/list.do"
      view_path: "/portal/bbs/B0000002/view.do"
      menu_no: "200264"
      attachments: false

  - id: woorifis
    name: 우리에프아이에스
    adapter: woorifis
    base: "https://www.woorifis.com"
    enabled: true
    list_pages: 2          # 1페이지=10건
    request_delay: 0.8
    timeout: 30
    warm_path: "/kor/company/announceList"
    skip_require: true     # 사업공고 전용 게시판
    params:
      list_path: "/kor/company/announceList"
      view_path: "/kor/company/announceDetail?boardId="
      attachments: false

  - id: kbfg
    name: KB금융지주
    adapter: kbfg
    base: "https://www.kbfg.com"
    enabled: true
    list_pages: 1          # 목록 API 가 한 번에 20건을 준다
    request_delay: 0.8
    timeout: 30
    warm_path: "/kor/pr/notice/list.htm"
    params:
      board_id: "9"        # 공지사항 게시판
      page_size: "20"
      view_path: "/kor/pr/notice/view.htm"
      attachments: false

  - id: wooribank
    name: 우리은행
    adapter: wooribank
    base: "https://spot.wooribank.com"
    enabled: true
    list_pages: 2          # 1페이지=10건. 목록을 POST 로 받는다
    request_delay: 0.8
    timeout: 30
    warm_path: "/pot/Dream?withyou=BPPBC0038"
    params:
      list_path: "/pot/Dream?withyou=BPPBC0038"
      api_path: "/pot/jcc?withyou=BPPBC0038&__ID=c064827"
      board_id: "B00072"
      attachments: false

  - id: hanati
    name: 하나금융TI
    adapter: hanati
    base: "https://tipartner.hanati.co.kr"
    enabled: true
    list_pages: 1          # 로그인 화면에 보이는 최근 입찰공지 몇 건만 감시된다
    request_delay: 0.8
    timeout: 30
    warm_path: "/spLogin.do"
    params:
      list_path: "/spLogin.do"
      attachments: false

filter:
  # 판별 순서: exclude 에 하나라도 걸리면 즉시 탈락 → 그다음 include 중 하나라도 있으면 통과.
  # include_keywords 를 비우면 필터가 해제되어 전체 공고가 발송됩니다.
  #
  # [1단계 게이트] 이 중 하나도 없으면 '공고' 자체가 아니라고 보고 탈락시킵니다.
  # 서비스 점검 안내·약관 변경 안내 등이 섞인 게시판(하나은행 새소식) 대응입니다.
  require_keywords:
    - 공고
    - 입찰
    - 제안
    - RFP
    - RFI

  # [2단계 통과] IT/SI 프로젝트성 공고로 보는 단어
  include_keywords:
    - 제안요청
    - 제안 요청
    - RFP
    - RFI
    - 정보제공요청
    - 사전규격
    - 구축
    - 재구축
    - 고도화
    - 현대화
    - 차세대
    - 개발
    - 시스템
    - 솔루션
    - 소프트웨어
    - S/W
    - SW
    - 프로그램
    - 플랫폼
    - 클라우드
    - 인프라
    - IT자원
    - 라이선스
    - 용역
    - 컨설팅
    - 유지보수
    - 전환
    - 통합
    # 하나은행 등이 쓰는 표현 · IT 도메인어 보강
    - 제안 공고
    - 제안공고
    - 제안서
    # 제목에 IT 단어가 없는 제안 공고 대응 ('AX상세설계'를 위한 제안 재공고)
    # '제안 공고' 는 '제안 재공고' 와 글자가 달라 걸리지 않는다.
    - 제안
    - 설계
    - 안정화
    - 위탁운영
    - 아웃소싱
    - 정보화
    - 전산
    - 네트워크
    - 보안
    - 데이터
    - 서버
    - 백업
    - PMO
    - ISP
    - BPR
    - VDI
    - 포털
    - 포탈
    - 업그레이드
    - 방화벽

  # [탈락] 비IT·비금융 건. include 보다 우선 적용됩니다.
  exclude_keywords:
    # 단순 물품 구매·총무
    - 캘린더
    - 토너
    - 소모품
    - 사무용품
    - 판촉
    - 기념품
    - 사은품
    - 경품
    - 상품권
    - 인쇄물
    - 테이프
    - 비품
    - 가구
    - 우편
    - 폐기
    - 배송
    # 자산·시설
    - 부동산
    - 매각
    - 임대
    - 인테리어
    - 재건축        # include 의 '설계' 가 건축 설계공모를 통과시키지 않도록
    - 설계공모
    - 조경
    - 시설공사
    - 전기공사
    - 소방
    - 청소
    - 방역
    - 경비용역
    - 주차
    - 차량
    - 셔틀
    # 스포츠·후원
    - 스포츠
    - 축구
    - 야구
    - 농구단
    - 사격단
    - 골프
    - 후원
    - 스폰서
    # 광고·홍보·행사 대행
    - 마케팅대행
    - 마케팅 대행
    - 광고대행
    - 광고 대행
    - 홍보대행
    - 홍보 대행
    - 행사대행
    - 행사 대행
    - 이벤트대행
    - 공연
    - 전시회
    - 촬영
    - 영상제작
    # 복리후생·서비스
    - 급식
    - 케이터링
    - 다과
    - 카페
    - 라운지
    - 컨시어지
    - 헬스케어
    - 연수
    - 여행
    - 숙박
    - 세탁
    - 의전
    # 농협 게시판에 섞여 있는 시설공사·농축산 사업
    - 신축
    - 증축
    - 개보수
    - 공판장
    - 축산물
    - 시상식
    - 도정
    - 비료
    - 사료
    - 로컬푸드
    - 직매장
    - 체험공간
    - 홍보물
    - 선거
    - 대관
    - 전기설비
    - 증설공사
    - 소방설비
    # 하드웨어·장비 조달 (SI 사업이 아니므로 제외)
    - 장비
    - 스토리지
    - 스위치
    - x86
    - HBA
    - VTL
    - PTL
    - 서버 교체
    - 서버교체
    - 서버 구매
    - 서버구매
    - 노후서버
    - 노후 서버
    - 설비 교체
    - 설비교체
    - 통합도입
    - 인프라자원
    - 볼륨매니저
    # 농협 계열 게시판의 농축산·유통 사업
    - 하나로마트
    - 가축
    - 분뇨
    - 종돈
    - 사양관리
    - 축산관련
    - 영농
    # 판촉물·사무공간
    - 달력
    - 수첩
    - 사무공간
    # 자산운용사 선정 (신한자산운용 게시판 대부분)
    - 위탁운용
    - 출자사업
    - 운용사

mail:
  recipients:
    - "bjkim@pron.co.kr"
  # 여러 명으로 늘릴 때는 위 목록에 줄만 추가하면 됩니다.
  #   - "hong@pron.co.kr"
  #   - "kim@pron.co.kr"
  # 관리자 주소. 아래 두 가지는 일반 수신자에게 가지 않고 여기로만 발송됩니다.
  #   · 장애 경보 (조회 실패 / 구조 변경 / 스케줄러 정지 의심)
  #   · 주간 정상 동작 보고 (heartbeat)
  # 비워두면 recipients 전원에게 발송되므로, 관리자만 받으려면 반드시 채워두십시오.
  alert_recipients:
    - "bjkim@pron.co.kr"
    - "jylee@pron.co.kr"
  subject_prefix: "[프로엔솔루션]"   # 최종 제목: [프로엔솔루션] 신규 금융 프로젝트 공고 알림 N건
  # false = 첨부파일을 내려받지 않고 메일에 링크만 담습니다.
  # 첨부 '파일명'은 그대로 표시되므로 어떤 문서가 있는지는 알 수 있습니다.
  # 끄면 실행 시간이 크게 줄고 메일 용량 제한 문제도 사라집니다.
  attach_pdf: false
  max_attach_mb: 20          # 총 첨부 상한(초과분은 링크만 안내)
  send_when_empty: true      # 신규 공고가 없어도 '정상 동작 보고'를 보낼지.
                             # true = 매일 발송(관리자에게만). 시스템 생존 확인용.
  heartbeat_weekday: 0       # send_when_empty 가 false 일 때만 의미 있음.
                             # 해당 요일에만 생존 보고 발송(0=월, -1=사용 안 함)

runtime:
  consecutive_failure_alert: 2   # 연속 N회 실패 시 경보 메일
  stale_hours_alert: 30          # 마지막 성공이 N시간을 넘기면 경보
  keep_html_snapshot: true       # 파싱 실패 시 원본 HTML 보존(구조 변경 분석용)
