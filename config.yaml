mail:
  recipients:
    - "bjkim@pron.co.kr"
  # 여러 명으로 늘릴 때는 위 목록에 줄만 추가하면 됩니다.
  #   - "hong@pron.co.kr"
  #   - "kim@pron.co.kr"
  # 관리자 주소. 아래 두 가지는 일반 수신자에게 가지 않고 여기로만 발송됩니다.
  #   · 장애 경보 (조회 실패 / 구조 변경 / 스케줄러 정지 의심)
  #   · 주간 정상 동작 보고 (heartbeat)
  # 비워두면 recipients 전원에게 발송되므로, 관리자만 받으려면 반드시 채워두십시오.
  alert_recipients:
    - "bjkim@pron.co.kr"
  subject_prefix: "[금융공고]"   # 감시 기관이 늘어 KB 전용 표기를 걷어냄
  attach_pdf: true           # 공고 PDF 원본을 메일에 첨부
  max_attach_mb: 20          # 총 첨부 상한(초과분은 링크만 안내)
  send_when_empty: true      # 신규 공고가 없어도 '정상 동작 보고'를 보낼지.
                             # true = 매일 발송(관리자에게만). 시스템 생존 확인용.
  heartbeat_weekday: 0       # send_when_empty 가 false 일 때만 의미 있음.
                             # 해당 요일에만 생존 보고 발송(0=월, -1=사용 안 함)

runtime:
  consecutive_failure_alert: 2   # 연속 N회 실패 시 경보 메일
  stale_hours_alert: 30          # 마지막 성공이 N시간을 넘기면 경보
  keep_html_snapshot: true       # 파싱 실패 시 원본 HTML 보존(구조 변경 분석용)
